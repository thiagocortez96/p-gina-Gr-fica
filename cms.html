<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS - Gerenciador de Produtos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Lexend Deca', sans-serif; background-color: #f0f0f0; }
        .neo-shadow { box-shadow: 8px 8px 0px 0px rgba(0,0,0,1); }
        .neo-shadow-sm { box-shadow: 4px 4px 0px 0px rgba(0,0,0,1); }
        input, textarea, select { border: 3px solid black !important; padding: 12px; font-weight: bold; outline: none; width: 100%; transition: all 0.2s; }
        input:focus { background-color: #CCFF00; transform: translate(-2px, -2px); box-shadow: 4px 4px 0px 0px black; }
        label { font-weight: 900; text-transform: uppercase; font-size: 0.7rem; margin-bottom: 4px; display: block; color: #000; }
        .card { background: white; border: 4px solid black; padding: 24px; }
        .grid-precos { display: grid; grid-template-cols: 1.5fr 1fr 1fr 40px; gap: 10px; align-items: end; background: #fff; padding: 10px; border: 2px solid black; margin-bottom: 10px; }
    </style>
</head>
<body class="p-4 md:p-10">

    <header class="max-w-6xl mx-auto mb-10 flex flex-col md:flex-row justify-between items-center gap-6">
        <h1 class="text-4xl font-black uppercase bg-black text-[#CCFF00] inline-block px-6 py-3 neo-shadow italic">Painel Admin</h1>
        <a href="index.html" class="font-black underline uppercase text-sm border-4 border-black px-4 py-2 bg-white hover:bg-black hover:text-white transition-all neo-shadow-sm">⬅ Voltar ao Site</a>
    </header>

    <main class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-5 gap-8">
        
        <div class="lg:col-span-2 space-y-6">
            <div class="card neo-shadow">
                <h2 class="text-xl font-black uppercase border-b-4 border-black mb-6 pb-2">📦 Informações</h2>
                <div class="space-y-4">
                    <div><label>Nome do Produto</label><input type="text" id="nome" placeholder="Ex: Panfleto Couché"></div>
                    <div><label>Categoria</label><input type="text" id="cat" placeholder="Ex: Impressos"></div>
                    <div><label>Descrição Curta</label><textarea id="desc" class="h-24" placeholder="Detalhes que aparecem no card..."></textarea></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label>Material</label><input type="text" id="material" value="Couché 300g"></div>
                        <div><label>Acabamento</label><input type="text" id="acabamento" value="Verniz Total"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-3 space-y-6">
            <div class="card neo-shadow">
                <div class="flex justify-between items-center border-b-4 border-black mb-6 pb-2">
                    <h2 class="text-xl font-black uppercase">💰 Tabela de Custos</h2>
                    <span class="text-[10px] bg-red-500 text-white px-2 py-1 font-bold">CUSTO BRUTO (O SISTEMA SOMA 30% DEPOIS)</span>
                </div>
                
                <div id="container-precos">
                    <div class="grid-precos">
                        <div><label>Tamanho</label><input type="text" class="p-tam" placeholder="A5"></div>
                        <div><label>Qtd</label><input type="text" class="p-qtd" placeholder="1000"></div>
                        <div><label>Custo (R$)</label><input type="number" class="p-custo" placeholder="0.00"></div>
                        <button onclick="this.parentElement.remove()" class="bg-black text-white h-[50px] font-bold">X</button>
                    </div>
                </div>

                <button onclick="addLinha()" class="w-full border-4 border-black border-dashed py-3 font-black uppercase text-sm mt-2 hover:bg-gray-100 transition-all">+ Adicionar Variação</button>

                <div class="mt-10">
                    <button onclick="salvarProduto()" id="btn-salvar" class="w-full bg-[#CCFF00] text-black py-6 font-black text-3xl uppercase neo-shadow border-4 border-black hover:bg-black hover:text-[#CCFF00] active:translate-y-1 transition-all">
                        🚀 Publicar Produto
                    </button>
                </div>
            </div>
        </div>

    </main>

    <script src="cms.js"></script>
</body>
</html>
