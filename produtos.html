<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Impresso</title>
    <link rel="icon" type="image/x-icon" href="th (4).png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Lexend Deca', sans-serif; background-color: #f0f0f0; }
        
        .neo-shadow { box-shadow: 8px 8px 0px 0px rgba(0,0,0,1); }
        .neo-shadow-sm { box-shadow: 4px 4px 0px 0px rgba(0,0,0,1); }
        
        .active-btn { 
            background-color: #CCFF00 !important; 
            transform: translate(2px, 2px); 
            box-shadow: 1px 1px 0px 0px rgba(0,0,0,1); 
        }

        /* Estilo para o menu suspenso no mobile */
        @media (max-width: 767px) {
            #filters.show-mobile {
                display: flex !important;
                position: absolute;
                top: 100%;
                left: 1.5rem;
                right: 1.5rem;
                z-index: 100;
                background: white;
                box-shadow: 8px 8px 0px black;
                padding: 1rem;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row overflow-x-hidden">

    <aside class="w-full md:w-72 bg-white border-b-4 md:border-b-0 md:border-r-4 border-black p-6 sticky top-0 z-50 md:relative">
        <h2 class="hidden md:inline-block text-2xl font-black uppercase mb-8 border-b-4 border-black">Catálogo</h2>
        
        <div class="md:hidden flex justify-between items-center bg-black p-4 mb-0 neo-shadow">
            <span class="text-[#CCFF00] font-black uppercase text-sm">Categorias</span>
            <button onclick="toggleMenu()" class="text-[#CCFF00] focus:outline-none">
                <svg id="menu-icon" class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M4 6h16M4 12h16m-7 6h7"></path>
                </svg>
            </button>
        </div>

        <nav id="filters" class="hidden md:flex flex-col gap-3 mt-4 md:mt-0">
            </nav>
    </aside>

    <main class="flex-1 p-8 md:p-16">
        <header class="mb-12">
            <h1 class="text-4xl md:text-6xl font-black uppercase leading-tight">
                O que podemos <br> 
                <span class="bg-[#CCFF00] px-4 border-4 border-black neo-shadow">Criar hoje?</span>
            </h1>
        </header>

        <div id="product-grid" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-8">
            </div>
    </main>

    <script src="funcao.js"></script>
</body>
</html>
